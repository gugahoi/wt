name: Release

# Build the wt binaries, attach them to a GitHub Release, and update the Homebrew formula.
# Trigger by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
# Or run manually from the Actions tab, supplying a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9] ]]; then
            echo "Release tag must start with v, for example v1.0.0." >&2
            exit 1
          fi
          echo "tag=${TAG}" >>"${GITHUB_OUTPUT}"

      - name: Check out manual tag if it exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git checkout "${TAG}"
          else
            echo "Tag ${TAG} does not exist yet; the release will create it from this commit."
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release assets
        run: ./scripts/build-release.sh "${{ steps.release.outputs.tag }}" dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.tar.gz --clobber
          elif git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            gh release create "${TAG}" dist/*.tar.gz --title "${TAG}" --generate-notes
          else
            gh release create "${TAG}" dist/*.tar.gz --title "${TAG}" --generate-notes --target "${GITHUB_SHA}"
          fi

      - name: Generate Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOMEBREW_TAP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: gugahoi
          repositories: homebrew-tap

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_DIR: dist
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/gugahoi/homebrew-tap.git" homebrew-tap
          ./scripts/write-formula.sh "${TAG}" "${ASSET_DIR}" homebrew-tap/Formula/wt.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/wt.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
          else
            git -C homebrew-tap commit -m "Update wt formula to ${TAG}"
            git -C homebrew-tap push
          fi
